<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My AI Agent</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111827;
}


/* LOGIN */

#authScreen {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;
}


.auth-card {

    width: 360px;

    background: white;

    padding: 30px;

    border-radius: 18px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.1);
}


.auth-card h2 {

    margin-top: 0;

    text-align: center;
}


.auth-card input {

    width: 100%;

    padding: 13px;

    margin-bottom: 12px;

    border:
        1px solid #ddd;

    border-radius: 9px;
}


.auth-card button {

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 9px;

    background: #111827;

    color: white;

    cursor: pointer;

    margin-bottom: 8px;
}


.auth-error {

    color: #dc2626;

    font-size: 13px;

    margin-top: 8px;
}


/* MAIN */

#mainApp {

    height: 100vh;

    display: none;
}


.layout {

    height: 100%;

    display: flex;
}


/* SIDEBAR */

.sidebar {

    width: 260px;

    background: #111827;

    color: white;

    padding: 15px;

    display: flex;

    flex-direction: column;
}


.logo {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 15px;
}


.new-chat {

    padding: 11px;

    border: 1px solid #374151;

    background: #1f2937;

    color: white;

    border-radius: 8px;

    cursor: pointer;

    margin-bottom: 15px;
}


#chatList {

    flex: 1;

    overflow-y: auto;
}


.chat-item {

    padding: 10px;

    margin-bottom: 5px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 14px;
}


.chat-item:hover {

    background: #1f2937;
}


.chat-item.active {

    background: #374151;
}


.logout {

    border: none;

    padding: 10px;

    border-radius: 8px;

    cursor: pointer;
}


/* CHAT */

.chat-area {

    flex: 1;

    display: flex;

    flex-direction: column;

    background: white;
}


.header {

    padding: 16px 22px;

    border-bottom:
        1px solid #e5e7eb;

    font-weight: bold;

    font-size: 18px;
}


#chat {

    flex: 1;

    overflow-y: auto;

    padding: 25px;

    background: #fafafa;
}


.row {

    display: flex;

    margin-bottom: 15px;
}


.row.user {

    justify-content: flex-end;
}


.row.agent {

    justify-content: flex-start;
}


.bubble {

    max-width: 75%;

    padding: 12px 16px;

    border-radius: 15px;

    line-height: 1.5;

    overflow-wrap: anywhere;
}


.user .bubble {

    background: #111827;

    color: white;
}


.agent .bubble {

    background: #e5e7eb;
}


.agent .bubble pre {

    background: #111827;

    color: white;

    padding: 12px;

    overflow-x: auto;

    border-radius: 8px;
}


/* INPUT */

.input-box {

    padding: 15px;

    border-top:
        1px solid #ddd;
}


.controls {

    display: flex;

    gap: 8px;
}


#messageInput {

    flex: 1;

    padding: 13px;

    border:
        1px solid #ddd;

    border-radius: 10px;
}


button {

    cursor: pointer;
}


.send {

    border: none;

    background: #111827;

    color: white;

    padding: 12px 18px;

    border-radius: 9px;
}


.tool-button {

    border: none;

    background: #e5e7eb;

    padding: 11px;

    border-radius: 9px;
}


#fileInput {

    display: none;
}


.file-name {

    margin-top: 7px;

    font-size: 12px;

    color: #6b7280;
}


@media(max-width:700px) {

    .sidebar {

        width: 190px;
    }

    .bubble {

        max-width: 90%;
    }

}

</style>

</head>

<body>


<!-- LOGIN -->

<div id="authScreen">

<div class="auth-card">

<h2>My AI Agent</h2>

<input
    id="username"
    placeholder="Username"
>

<input
    id="password"
    type="password"
    placeholder="Password"
>

<button onclick="login()">
Login
</button>

<button onclick="register()">
Create Account
</button>

<div
    id="authError"
    class="auth-error"
></div>

</div>

</div>


<!-- APP -->

<div id="mainApp">

<div class="layout">


<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">
🤖 AI Agent
</div>

<button
    class="new-chat"
    onclick="newChat()"
>
+ New Chat
</button>

<div id="chatList"></div>

<button
    class="logout"
    onclick="logout()"
>
Logout
</button>

</div>


<!-- CHAT AREA -->

<div class="chat-area">

<div
    id="chatTitle"
    class="header"
>
New Chat
</div>


<div id="chat"></div>


<div class="input-box">

<div class="controls">

<label
    class="tool-button"
    for="fileInput"
>
📎
</label>

<input
    type="file"
    id="fileInput"
    accept=".txt,.csv,.pdf"
>

<button
    class="tool-button"
    onclick="startVoice()"
>
🎤
</button>

<input
    id="messageInput"
    placeholder="Ask anything..."
>

<button
    class="send"
    onclick="sendMessage()"
>
Send
</button>

</div>

<div
    id="fileName"
    class="file-name"
></div>

</div>

</div>

</div>

</div>


<script>

const API_URL = window.location.origin;

let token = localStorage.getItem("token");
let currentChatId = null;
let selectedFile = null;


const authScreen =
    document.getElementById("authScreen");

const mainApp =
    document.getElementById("mainApp");

const chat =
    document.getElementById("chat");

const chatList =
    document.getElementById("chatList");

const messageInput =
    document.getElementById("messageInput");

const fileInput =
    document.getElementById("fileInput");

const fileName =
    document.getElementById("fileName");


/* =====================================================
   REQUEST HELPER
===================================================== */

async function request(
    url,
    options = {}
) {

    options.headers =
        options.headers || {};


    if (token) {

        options.headers["Authorization"] =
            "Bearer " + token;

    }


    return fetch(
        API_URL + url,
        options
    );
}


/* =====================================================
   AUTH
===================================================== */

async function login() {

    await authenticate(
        "/login"
    );

}


async function register() {

    await authenticate(
        "/register"
    );

}


async function authenticate(
    endpoint
) {

    const username =
        document
            .getElementById(
                "username"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "password"
            )
            .value;


    const error =
        document.getElementById(
            "authError"
        );


    error.textContent = "";


    if (
        !username ||
        !password
    ) {

        error.textContent =
            "Please enter username and password.";

        return;
    }


    try {

        const response =
            await fetch(
                API_URL + endpoint,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            password:
                                password

                        })

                }
            );


        let data = {};


        try {

            data =
                await response.json();

        }

        catch {

            data = {};

        }


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Authentication failed"
            );

        }


        token =
            data.token;


        localStorage.setItem(
            "token",
            token
        );


        await showApp();

    }

    catch(e) {

        console.error(
            "AUTH ERROR:",
            e
        );


        error.textContent =
            e.message;

    }

}


function logout() {

    localStorage.removeItem(
        "token"
    );


    token = null;

    currentChatId = null;

    location.reload();

}


/* =====================================================
   APP START
===================================================== */

async function showApp() {

    authScreen.style.display =
        "none";


    mainApp.style.display =
        "block";


    try {

        await loadChats();


        if (!currentChatId) {

            await newChat();

        }

    }

    catch(e) {

        console.error(
            "APP ERROR:",
            e
        );

    }

}


/* =====================================================
   CHAT LIST
===================================================== */

async function loadChats() {

    const response =
        await request(
            "/chats"
        );


    if (
        response.status === 401
    ) {

        logout();

        return;

    }


    if (!response.ok) {

        const data =
            await response.json();

        throw new Error(
            data.detail ||
            "Could not load chats"
        );

    }


    const data =
        await response.json();


    chatList.innerHTML =
        "";


    const chats =
        data.chats || [];


    chats.forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "chat-item";


            if (
                item.chat_id ===
                currentChatId
            ) {

                div.classList.add(
                    "active"
                );

            }


            div.textContent =
                item.title ||
                "New Chat";


            div.onclick =
                () =>
                    openChat(
                        item.chat_id
                    );


            chatList.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   NEW CHAT
===================================================== */

async function newChat() {

    try {

        const response =
            await request(
                "/chats",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            title:
                                "New Chat"

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Could not create chat"
            );

        }


        currentChatId =
            data.chat_id;


        chat.innerHTML =
            "";


        document
            .getElementById(
                "chatTitle"
            )
            .textContent =
                "New Chat";


        addMessage(
            "Hello! 👋 How can I help you?",
            "agent"
        );


        await loadChats();

    }

    catch(e) {

        console.error(
            "NEW CHAT ERROR:",
            e
        );


        addMessage(
            "Error: " + e.message,
            "agent"
        );

    }

}


/* =====================================================
   OPEN CHAT
===================================================== */

async function openChat(
    chatId
) {

    try {

        currentChatId =
            chatId;


        const response =
            await request(
                "/chats/" +
                encodeURIComponent(
                    chatId
                )
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Could not open chat"
            );

        }


        chat.innerHTML =
            "";


        document
            .getElementById(
                "chatTitle"
            )
            .textContent =
                data.title ||
                "New Chat";


        const messages =
            data.messages || [];


        messages.forEach(
            item => {

                addMessage(
                    item.content,

                    item.role === "user"
                        ? "user"
                        : "agent"
                );

            }
        );


        await loadChats();

    }

    catch(e) {

        console.error(
            "OPEN CHAT ERROR:",
            e
        );

    }

}


/* =====================================================
   MESSAGE DISPLAY
===================================================== */

function addMessage(
    text,
    type
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "row " + type;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    if (
        type === "agent"
    ) {

        bubble.innerHTML =
            marked.parse(
                text || ""
            );

    }

    else {

        bubble.textContent =
            text || "";

    }


    row.appendChild(
        bubble
    );


    chat.appendChild(
        row
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================================================
   FILE
===================================================== */

fileInput.onchange =
    () => {

        selectedFile =
            fileInput.files[0];


        fileName.textContent =
            selectedFile
                ? selectedFile.name
                : "";

    };


async function uploadFile() {

    if (!selectedFile) {

        return null;

    }


    const formData =
        new FormData();


    formData.append(
        "file",
        selectedFile
    );


    const response =
        await request(
            "/upload",
            {

                method:
                    "POST",

                body:
                    formData

            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.detail ||
            "Upload failed"
        );

    }


    return data;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

    const text =
        messageInput
            .value
            .trim();


    if (
        !text &&
        !selectedFile
    ) {

        return;

    }


    if (!currentChatId) {

        await newChat();

    }


    if (text) {

        addMessage(
            text,
            "user"
        );

    }


    if (selectedFile) {

        addMessage(
            "📎 " +
            selectedFile.name,
            "user"
        );

    }


    messageInput.value =
        "";


    try {

        let uploaded =
            null;


        if (selectedFile) {

            uploaded =
                await uploadFile();

        }


        let finalText =
            text;


        if (!finalText) {

            finalText =
                "Analyze this file.";

        }


        const response =
            await request(
                "/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            chat_id:
                                currentChatId,

                            message:
                                finalText,

                            file_path:
                                uploaded
                                    ? uploaded.file_path
                                    : null

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                data.answer ||
                "Chat request failed"
            );

        }


        addMessage(
            data.answer ||
            "No response.",
            "agent"
        );


        if (data.title) {

            document
                .getElementById(
                    "chatTitle"
                )
                .textContent =
                    data.title;

        }


        selectedFile =
            null;


        fileInput.value =
            "";


        fileName.textContent =
            "";


        await loadChats();

    }

    catch(e) {

        console.error(
            "CHAT ERROR:",
            e
        );


        addMessage(
            "Error: " +
            e.message,
            "agent"
        );

    }

}


/* =====================================================
   VOICE
===================================================== */

function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "Voice recognition is not supported in this browser."
        );

        return;

    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.interimResults =
        false;


    recognition.onresult =
        function(event) {

            const text =
                event
                    .results[0][0]
                    .transcript;


            messageInput.value =
                text;

        };


    recognition.start();

}


/* =====================================================
   ENTER TO SEND
===================================================== */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   START
===================================================== */

if (token) {

    showApp();

}

</script>

</body>

</html>
